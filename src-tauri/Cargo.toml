[package]
name = "omnivyx-vision"
version = "0.1.0"
description = "Native presenter kernel for OmniVyx Vision"
authors = ["OmniVyx Vision"]
license = ""
repository = "https://github.com/MichaelDanCurtis/OmniVyx-Vision"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "omnivyx_vision_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
